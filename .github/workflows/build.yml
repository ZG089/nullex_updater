name: Android Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          sdkmanager --channel=1 "platform-tools" "platforms;android-37.2-beta3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nullex-updater-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Verify release APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify release APK is installable
        run: |
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          if "$aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "testOnly='true'"; then
            echo "Release APK is marked test-only"
            exit 1
          fi

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: nullex-updater-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
